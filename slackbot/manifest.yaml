# Paste into api.slack.com/apps -> Create New App -> From a manifest.
# Sets Socket Mode, the Approve button, @mention events and scopes in one go.
display_information:
  name: Least
  description: Works out what a new hire needs from the code they will work on
  background_color: "#29457E"
features:
  bot_user:
    display_name: Least
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
